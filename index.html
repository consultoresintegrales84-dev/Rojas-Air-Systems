<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Repuestos A/C Automotriz</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <div class="logo">❄️ AutoAire Repuestos</div>
        <nav>
            <input type="text" placeholder="Buscar repuesto (ej. Compresor)...">
            <button class="cart-btn">🛒 Carrito (0)</button>
        </nav>
    </header>

    <section class="filters">
        <div class="filter-group">
    <select id="select-marca">
        <option value="">Selecciona Marca</option>
        <option value="toyota">Toyota</option>
        <option value="ford">Ford</option>
        <option value="chevrolet">Chevrolet</option>
    </select>
    
    <select id="select-modelo">
        <option value="">Selecciona Modelo</option>
    </select>
    
    <button class="search-btn" id="btn-buscar">Filtrar</button>
</div>
    </section>

    <main class="catalog"id="contenedor-productos"></main>
        
        </div>

        <div class="product-card">
            <img src="https://via.placeholder.com/150" alt="Evaporador">
            <div class="card-body">
                <p class="compatibility">Compatible con: Honda Civic 16-21</p>
                <p class="price">$85.00</p>
                <button class="add-btn">Añadir al carrito</button>
            </div>
        </div>
    </main>
<script src="script.js"></script>
<div id="modal-carrito" class="modal">
    <div class="modal-content">
        <span class="close-btn">&times;</span>
        <h2>Tu Carrito de Compras</h2>
        <div id="lista-carrito-items">
            </div>
        <div class="modal-footer">
            <h3>Total: $<span id="total-precio">0</span></h3>
            <button class="checkout-btn">Finalizar Compra por WhatsApp</button>
        </div>
    </div>
</div>
<a href="https://wa.me/5804248688527" class="whatsapp-float" target="_blank">
    <img src="https://upload.wikimedia.org/wikipedia/commons/6/6b/WhatsApp.svg" alt="WhatsApp">
</a>
</body>
</html>
