    <!-- Script principal con barra de progreso animada de 0 a 100 -->
    <script>
    let canvas = null;

    document.addEventListener("DOMContentLoaded", () => {
        const inputField = document.getElementById('promptInput');
        if (inputField) {
            inputField.addEventListener("keydown", function(event) {
                if (event.key === "Enter") {
                    generarContenidoIA();
                }
            });
        }
        canvas = new fabric.Canvas('flyerCanvas');
    });

    // Funcion para animar la barra de progreso de 0 a 100%
    function simularProgreso(duracionMs, callback) {
        const loadingDiv = document.getElementById('loading');
        const progressBar = document.getElementById('progressBar');
        const progressPercent = document.getElementById('progressPercent');
        const loadingText = document.getElementById('loadingText');

        loadingDiv.classList.remove('hidden');
        loadingDiv.classList.add('flex');
        
        let progreso = 0;
        progressBar.style.width = '0%';
        progressPercent.textContent = '0%';
        loadingText.textContent = "Conectando con el motor de IA...";

        const intervaloTiempo = 50;
        const incremento = 100 / (duracionMs / intervaloTiempo);

        const timer = setInterval(() => {
            progreso += incremento;
            if (progreso >= 95) {
                progreso = 95;
                loadingText.textContent = "Renderizando diseno final...";
            }
            
            const porcentajeActual = Math.floor(progreso);
            progressBar.style.width = porcentajeActual + '%';
            progressPercent.textContent = porcentajeActual + '%';
        }, intervaloTiempo);

        return function finalizarProgreso() {
            clearInterval(timer);
            progressBar.style.width = '100%';
            progressPercent.textContent = '100%';
            loadingText.textContent = "!Completado con exito!";
            
            setTimeout(() => {
                loadingDiv.classList.add('hidden');
                loadingDiv.classList.remove('flex');
            }, 400);
            
            if (callback) callback();
        };
    }

    async function generarContenidoIA() {
        const promptInput = document.getElementById('promptInput');
        const prompt = promptInput.value.trim();
        const consoleDiv = document.getElementById('outputConsole');
        const imageContainer = document.getElementById('imageContainer');
        const preguntaContainer = document.getElementById('preguntaContainer');
        const preguntaTexto = document.getElementById('preguntaTexto');
        const modoOperacion = document.getElementById('modoOperacion').value;

        if (!prompt) {
            alert('Por favor, introduce una semilla o descripcion valida.');
            return;
        }

        preguntaTexto.textContent = prompt;
        preguntaContainer.classList.remove('hidden');

       const urlBackend = (window.location.hostname.includes("loca.lt") || window.location.hostname.includes("web.app")) 
    ? 'https://vcontaiapp.loca.lt/predict' 
    : '/predict';
        if (modoOperacion === 'texto') {
            consoleDiv.textContent = "";
            consoleDiv.classList.remove('hidden', 'text-slate-500', 'text-red-400');
            imageContainer.classList.add('hidden');

            const detenerProgreso = simularProgreso(1500);

           try {
                const response = await fetch(urlBackend, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ msg: prompt })
                });            
               
                const data = await response.json();
                detenerProgreso();
                
                if (data.status === 'success') {
                    consoleDiv.textContent = data.response;
                } else {
                    consoleDiv.textContent = "[ERROR]: " + data.message;
                    consoleDiv.classList.add('text-red-400');
                }
                promptInput.value = "";
            } catch (error) {
                detenerProgreso();
                consoleDiv.textContent = "[ERROR]: No se pudo conectar con el servidor a traves de Cloudflare.";
                consoleDiv.classList.add('text-red-400');
            }
        } else {
            // Modo Imagen
            consoleDiv.classList.add('hidden');
            imageContainer.classList.remove('hidden');

            const detenerProgreso = simularProgreso(3000);

            try {
                const response = await fetch(urlBackend, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ msg: "genera una imagen de " + prompt })
                });

                const data = await response.json();

                if (data.status === 'success' && data.tipo === 'imagen') {
                    fabric.Image.fromURL(data.response, function(img) {
                        canvas.clear();
                        img.scaleToWidth(512);
                        img.scaleToHeight(512);
                        canvas.setBackgroundImage(img, canvas.renderAll.bind(canvas));
                        detenerProgreso();
                    }, { crossOrigin: 'anonymous' });
                } else {
                    detenerProgreso();
                    alert("Error al generar la imagen: " + (data.message || "Respuesta no valida"));
                }
                promptInput.value = "";
            } catch (error) {
                detenerProgreso();
                alert("Error de conexion al generar la imagen.");
            }
        }
    }

    function agregarTextoAlFlyer() {
        const textoInput = document.getElementById('customTextInput');
        const textoVal = textoInput.value.trim();
        if (!textoVal) return;

        const textObj = new fabric.IText(textoVal, {
            left: 50,
            top: 50,
            fill: '#ffffff',
            fontSize: 28,
            fontFamily: 'Arial',
            fontWeight: 'bold',
            stroke: '#000000',
            strokeWidth: 2,
            shadow: 'rgba(0,0,0,0.8) 2px 2px 4px'
        });

        canvas.add(textObj);
        canvas.setActiveObject(textObj);
        textoInput.value = "";
    }

    function eliminarObjetoSeleccionado() {
        const activeObj = canvas.getActiveObject();
        if (activeObj) {
            canvas.remove(activeObj);
        }
    }

    function descargarFlyerMacro(event) {
        event.preventDefault();
        canvas.discardActiveObject();
        canvas.renderAll();

        const dataURL = canvas.toDataURL({
            format: 'jpeg',
            quality: 0.95
        });

        const link = document.createElement('a');
        link.href = dataURL;
        link.download = 'vconta_flyer_publicitario.jpg';
        
        document.body.appendChild(link);
        link.click();
        
        setTimeout(() => {
            document.body.removeChild(link);
        }, 100);
    }

    // Registrar Service Worker y gestionar la instalacion de la PWA de forma limpia
    if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
            navigator.serviceWorker.register('/sw.js')
                .then(() => console.log('Service Worker registrado con exito'))
                .catch((err) => console.log('Error al registrar Service Worker:', err));
        });
    }

    let deferredPrompt = null;
    const btnInstalar = document.getElementById('btnInstalar');

    window.addEventListener('beforeinstallprompt', (e) => {
        e.preventDefault();
        deferredPrompt = e;
        
        if (btnInstalar) {
            btnInstalar.style.display = 'block';
        }
    });

    if (btnInstalar) {
        btnInstalar.addEventListener('click', async () => {
            if (!deferredPrompt) return;
            btnInstalar.style.display = 'none';
            deferredPrompt.prompt();
            
            const choiceResult = await deferredPrompt.userChoice;
            if (choiceResult.outcome === 'accepted') {
                console.log('El usuario acepto instalar la PWA');
            } else {
                console.log('El usuario cancelo la instalacion');
            }
            deferredPrompt = null;
        });
    }
</script>
